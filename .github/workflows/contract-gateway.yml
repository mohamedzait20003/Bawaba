name: Contract tests (one gateway)

on:
  workflow_call:
    inputs:
      gateway:
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    name: ${{ inputs.gateway }}
    runs-on: ubuntu-latest
    environment: contract-${{ inputs.gateway }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --project ${{ inputs.gateway }}
        env:
          BAWABA_CONTRACT: "1"
